<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>櫻井と話す</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; background: #1b1f24; color: #eef2f5;
    font-family: system-ui, "Yu Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 16px; box-sizing: border-box;
  }
  #avatarWrap {
    width: 240px; height: 240px; border-radius: 50%; background: #3a4450;
    overflow: hidden; transition: transform 0.05s linear;
  }
  #avatar { width: 100%; height: 100%; object-fit: cover; display: block; }
  #status { font-size: 0.9rem; opacity: 0.7; min-height: 1.2em; }
  #subtitle {
    min-height: 4em; max-width: 640px; text-align: center; font-size: 1.2rem;
    line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .row { display: flex; gap: 8px; width: 100%; max-width: 640px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1; min-width: 140px; padding: 10px; border-radius: 8px;
    border: 1px solid #556; background: #20262d; color: #eef2f5; font-size: 1rem;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: 0; background: #4f8cff;
    color: #fff; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #3a4450; }
</style>
</head>
<body>
<div id="avatarWrap"><img id="avatar" alt="" src="/avatar.png" onerror="this.remove()"></div>
<div id="status">準備中</div>
<div id="subtitle"></div>
<div class="row">
  <input id="key" type="password" placeholder="アクセスキー（合言葉）" autocomplete="off">
  <button id="start">話し始める</button>
</div>
<div class="row">
  <input id="text" type="text" placeholder="文字で入力もできます" maxlength="200">
  <button id="send" class="secondary">送る</button>
  <button id="reset" class="secondary">リセット</button>
</div>
<audio id="player"></audio>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const wrap = $('avatarWrap');
  const subtitle = $('subtitle');
  const statusEl = $('status');
  const player = $('player');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognition = null;
  let listening = false;  // 話しかけを受け付けている
  let speaking = false;   // 音声を再生中
  let busy = false;       // 返事を待っている
  let audioCtx = null, analyser = null, levels = null;

  // 音声の大きさに合わせて、アバターを少し大きくして口の動きに見せる
  function setupAnalyser() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    levels = new Uint8Array(analyser.frequencyBinCount);
    audioCtx.createMediaElementSource(player).connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  function animate() {
    let scale = 1;
    if (analyser && speaking) {
      analyser.getByteFrequencyData(levels);
      const avg = levels.reduce((a, b) => a + b, 0) / levels.length;
      scale = 1 + Math.min(avg / 128, 1) * 0.12;
    }
    wrap.style.transform = `scale(${scale})`;
    requestAnimationFrame(animate);
  }
  animate();

  // 音声認識：櫻井が話している間は止めて、自分の声を拾わないようにする
  function startRec() {
    if (!recognition || !listening || speaking || busy) return;
    try { recognition.start(); } catch (_) { /* すでに動いている */ }
  }
  function stopRec() {
    if (!recognition) return;
    try { recognition.stop(); } catch (_) {}
  }
  function beginListening() {
    if (!SR) {
      statusEl.textContent = "このブラウザは音声認識に対応していません（Chrome を使ってください）";
      return;
    }
    recognition = new SR();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = e => {
      const text = e.results[e.results.length - 1][0].transcript.trim();
      if (text) ask(text);
    };
    recognition.onend = () => startRec();
    listening = true;
    statusEl.textContent = "聞いています…";
    startRec();
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'X-Access-Key': $('key').value };
  }
  async function post(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(body),
    });
  }

  async function speak(text) {
    const r = await post('/api/tts', { text });
    if (!r.ok) {
      statusEl.textContent = "音声は出せませんでした（文字だけ表示しています）";
      return;
    }
    const blob = await r.blob();
    setupAnalyser();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    player.src = URL.createObjectURL(blob);
    const done = () => {
      speaking = false;
      statusEl.textContent = listening ? "聞いています…" : "";
      startRec();
    };
    player.onended = done;
    player.onerror = done;
    speaking = true;
    stopRec();
    statusEl.textContent = "話しています…";
    try {
      await player.play();
    } catch (e) {
      done();
    }
  }

  async function ask(text) {
    if (busy) return;
    busy = true;
    subtitle.textContent = `あなた：${text}`;
    statusEl.textContent = "考え中…";
    try {
      const r = await post('/api/chat', { text });
      const j = await r.json();
      if (!r.ok) {
        subtitle.textContent = j.error || "エラーが発生しました";
        return;
      }
      subtitle.textContent = `櫻井：${j.reply}`;
      await speak(j.reply);
    } catch (e) {
      subtitle.textContent = `通信エラー：${e}`;
    } finally {
      busy = false;
      if (!speaking) statusEl.textContent = listening ? "聞いています…" : "";
      startRec();
    }
  }

  function submitText() {
    const t = $('text').value.trim();
    if (!t) return;
    $('text').value = '';
    ask(t);
  }

  $('start').onclick = () => {
    if (!$('key').value.trim()) {
      statusEl.textContent = "アクセスキーを入力してください";
      return;
    }
    $('start').disabled = true;
    $('key').disabled = true;
    setupAnalyser();  // 音声を扱うには、ボタンを押した後に始める必要がある
    beginListening();
  };
  $('send').onclick = submitText;
  $('text').addEventListener('keydown', e => { if (e.key === 'Enter') submitText(); });
  $('reset').onclick = async () => {
    await fetch('/api/reset', { method: 'POST', headers: authHeaders() });
    subtitle.textContent = '';
  };
})();
</script>
</body>
</html>
