<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIと話す</title>
<style>
  /* Apple 風（ライト）。色は1つのアクセント（#0066cc）だけ。影は使わず、境界線と面の色で区切る */
  :root {
    color-scheme: light;
    --ink: #1d1d1f; --ink-2: #333333; --muted: #7a7a7a;
    --primary: #0066cc; --primary-hover: #0077ed; --focus: #0071e3;
    --canvas: #ffffff; --parchment: #f5f5f7;
    --hairline: #e0e0e0; --divider: #f0f0f0; --danger: #ff3b30;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--parchment); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    font-size: 17px; line-height: 1.47; letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
  }

  /* 参加画面：中央に白いカードを置く */
  #join { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #join .card {
    width: 100%; max-width: 400px; background: var(--canvas); border-radius: 18px;
    padding: 36px 28px; display: flex; flex-direction: column; gap: 12px;
  }
  #join h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 700; letter-spacing: -0.005em; line-height: 1.1; text-align: center; margin: 0 0 14px; }
  #join label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  #joinMsg { min-height: 1.3em; font-size: 14px; color: var(--danger); text-align: center; margin: 0; letter-spacing: 0; }

  /* 画面：映像は黒い「舞台」、操作は白いすりガラスの帯 */
  #room { position: fixed; inset: 0; background: #000; }
  #stage { position: absolute; inset: 0; background: #000; overflow: hidden; }
  #pic, #vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #vid { opacity: 0; transition: opacity 0.15s; }
  #vid.on { opacity: 1; }
  #placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #f5f5f7; opacity: 0.6; font-size: 17px; }

  /* 小窓（別窓が使えないスマホなどは、画面の中に小さく出す） */
  #room.mini { background: var(--parchment); }
  #room.mini #stage {
    position: fixed; inset: auto; top: 16px; right: 16px; width: min(300px, 60vw); aspect-ratio: 16 / 9;
    border-radius: 14px; border: 1px solid var(--hairline); z-index: 20;
  }

  #ui {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: rgba(255, 255, 255, 0.86);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--hairline);
    max-height: 75vh; overflow-y: auto; transition: opacity 0.3s; box-sizing: border-box;
  }
  #ui.idle { opacity: 0; pointer-events: none; }
  #room.mini #ui { background: var(--parchment); }

  #status { font-size: 14px; color: var(--muted); min-height: 1.3em; letter-spacing: 0; text-align: center; }
  #subtitle { min-height: 3em; max-width: 680px; text-align: center; font-size: 17px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 8px; width: 100%; max-width: 680px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .row input[type=text], #join input {
    border: 1px solid var(--hairline); background: var(--canvas); color: var(--ink);
    font: inherit; font-size: 17px; letter-spacing: -0.022em; outline: none;
  }
  .row input[type=text] { flex: 1; min-width: 150px; padding: 10px 18px; border-radius: 999px; }
  #join input { padding: 12px 16px; border-radius: 12px; }
  .row input[type=text]:focus, #join input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }

  .panel {
    width: 100%; max-width: 680px; background: var(--canvas); border: 1px solid var(--hairline);
    border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .panel h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  #moodList { list-style: none; margin: 0; padding: 0; font-size: 15px; }
  #moodList li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--divider); }
  #moodList button { padding: 4px 14px; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; letter-spacing: 0; line-height: 1.5; }

  /* ボタン：CTA は青い pill、それ以外は青い線の pill */
  button, .btn {
    font: inherit; font-size: 17px; letter-spacing: -0.022em; line-height: 1.2;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 11px 22px; border-radius: 999px; border: 1px solid var(--primary);
    background: var(--primary); color: #fff; cursor: pointer; transition: background 0.15s, transform 0.12s;
  }
  button:hover, .btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  button:active, .btn:active { transform: scale(0.95); }
  button:focus-visible, .btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { background: var(--hairline); border-color: var(--hairline); color: var(--muted); cursor: default; transform: none; }
  .secondary { background: transparent; color: var(--primary); border-color: var(--primary); }
  .secondary:hover { background: rgba(0, 102, 204, 0.06); border-color: var(--primary); }
  .btn input { display: none; }
  #join button { width: 100%; padding: 13px 22px; margin-top: 6px; }
  #join button:disabled { background: var(--hairline); border-color: var(--hairline); color: var(--muted); }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    #ui { padding: 12px 12px 16px; gap: 10px; }
    .panel { padding: 14px; }
  }
  /* 全画面のときは、操作の帯を出さない（Escで戻れます） */
  html.fs #ui { display: none; }
</style>
</head>
<body>

<section id="join">
  <div class="card">
    <h1>AIと話す</h1>
    <label for="key">アクセスキー</label>
    <input id="key" type="password" autocomplete="off" placeholder="アクセスキーを入力">
    <button id="join-btn" disabled>参加</button>
    <p id="joinMsg" role="alert"></p>
  </div>
</section>

<section id="room" hidden>
  <div id="stage">
    <img id="pic" alt="" src="/avatar.png">
    <video id="vid" playsinline loop muted></video>
    <div id="placeholder">画像を選んでください</div>
  </div>
  <div id="ui">
    <div id="status"></div>
    <div id="subtitle"></div>

    <div class="row">
      <label class="btn secondary">画像を選ぶ<input id="file" type="file" accept="image/*" hidden></label>
      <button id="pip" class="secondary">小窓に出す</button>
      <button id="fullscreen" class="secondary">全画面</button>
      <button id="talk">話し始める</button>
      <button id="stop" class="secondary">話すのをやめる</button>
      <button id="reset" class="secondary">リセット</button>
    </div>
    <div class="row">
      <input id="text" type="text" placeholder="文字で入力もできます" maxlength="200">
      <button id="send">送る</button>
    </div>

    <div class="panel">
      <h2>動画</h2>
      <p class="hint">ブラウザの中だけで使い、サーバーには送りません。</p>
      <div class="row">
        <label class="btn secondary">話している時の動画を選ぶ<input id="talkFile" type="file" accept="video/*" hidden></label>
        <span id="talkName" class="hint">未選択</span>
      </div>
      <div class="row">
        <input id="moodKw" type="text" placeholder="言葉（例：うれしい）" maxlength="20">
        <button id="moodAdd" class="secondary">動画を選んで追加</button>
      </div>
      <input id="moodFile" type="file" accept="video/*" hidden>
      <div class="row">
        <button id="pkgExport" class="secondary">パッケージを保存</button>
        <label class="btn secondary">パッケージを読み込む<input id="pkgFile" type="file" accept=".zip" hidden></label>
      </div>
      <ul id="moodList"></ul>
      <p class="hint">返事の文に言葉が入っている、または [happy] などの感情のタグが付いていると、その動画を流します（言葉に happy などと入れるとタグで切り替わります）。言葉に「狂気」と入れた動画は、狂気時の返事で、ほかの言葉に反応しなかった文に流れます。どれも当てはまらなければ「話している時の動画」を流します。</p>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<audio id="player"></audio>
<audio id="filler"></audio>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const pic = $('pic');
  const vid = $('vid');
  const placeholder = $('placeholder');
  const stage = $('stage');
  const subtitle = $('subtitle');
  const statusEl = $('status');
  const replyEl = $('player');
  const fillerEl = $('filler');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognition = null;
  let listening = false;  // 話しかけを受け付けている
  let speaking = false;   // AIが返事をしている間は true（音声認識を止める）
  let busy = false;       // 返事を待っている
  let fillerUrl = null;   // 相づちの音声
  let talkUrl = null;     // 話している時の動画
  let moods = [];         // [{ kw, name, blob, url }] 言葉ごとの動画
  let imageEntry = null;  // 選んだ画像 { blob, name }（保存用）
  let talkEntry = null;   // 選んだ話している時の動画 { blob, name }（保存用）

  // ---- 選んだ画像・動画をブラウザに保存する（IndexedDB。次に開いたときに戻す） ----
  const DB_NAME = 'web-talk', STORE = 'files', KEY = 'state';
  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveState() {
    try {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({
          image: imageEntry,
          talk: talkEntry,
          moods: moods.map(({ kw, name, blob }) => ({ kw, name, blob })),
        }, KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    } catch (_) {
      statusEl.textContent = "このブラウザでは、選んだ画像・動画を保存できません";
    }
  }
  async function restoreState() {
    try {
      const db = await openDb();
      const saved = await new Promise((resolve, reject) => {
        const req = db.transaction(STORE).objectStore(STORE).get(KEY);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      db.close();
      if (!saved) return;
      if (saved.image) {
        imageEntry = saved.image;
        pic.dataset.broken = '';
        pic.src = URL.createObjectURL(saved.image.blob);
      }
      if (saved.talk) {
        talkEntry = saved.talk;
        talkUrl = URL.createObjectURL(saved.talk.blob);
        $('talkName').textContent = saved.talk.name;
      }
      moods = (saved.moods || []).map(m => ({ ...m, url: URL.createObjectURL(m.blob) }));
      renderMoods();
    } catch (_) { /* 保存がなくても動く */ }
  }

  // ---- 映像だけを別の窓に出す（Discord では、この窓を共有する） ----
  // 別窓は、Chrome の画面が隠れても描画が止まりにくい。操作は元の画面で行う。
  let pipWin = null;
  function openVideoWindow() {
    if (!window.documentPictureInPicture) return Promise.resolve(false);
    if (pipWin) return Promise.resolve(true);
    // 注意：この関数の最初の await より前に requestWindow を呼ぶ（ボタンの操作の中で開くため）
    return documentPictureInPicture.requestWindow({ width: 640, height: 360 }).then(win => {
      pipWin = win;
      $('room').classList.remove('mini');
      // 見た目（CSS）を別窓にもコピーする
      for (const sheet of document.styleSheets) {
        try {
          const style = pipWin.document.createElement('style');
          style.textContent = [...sheet.cssRules].map(r => r.cssText).join('\n');
          pipWin.document.head.append(style);
        } catch (_) { /* 読めないCSSは飛ばす */ }
      }
      pipWin.document.body.style.cssText = 'margin:0;height:100vh;background:#000;overflow:hidden';
      pipWin.document.body.append(stage);
      // 別窓を閉じたら、映像を元の画面に戻す
      pipWin.addEventListener('pagehide', closeVideoWindow);
      statusEl.textContent = "映像は別の窓に出しています（Discord ではその窓を共有）";
      return true;
    }).catch(() => false);
  }
  function closeVideoWindow() {
    if (!pipWin) return;
    pipWin = null;
    $('room').insertBefore(stage, $('room').firstChild);
    statusEl.textContent = "映像を元の画面に戻しました";
    showUi();   // 操作パネル（全画面ボタンを含む）をもう一度見せる
  }
  // 小窓：PC の Chrome は別の窓に出す（Discord で共有しやすい）。別窓が使えないスマホなどは、画面の中の小窓にする
  function toggleMiniWindow() {
    const on = !$('room').classList.contains('mini');
    $('room').classList.toggle('mini', on);
    $('pip').textContent = on ? '小窓を戻す' : '小窓に出す';
    statusEl.textContent = on ? "映像を画面の中の小窓に出しています" : "映像を元の大きさに戻しました";
  }
  $('pip').onclick = async () => {
    if (pipWin) { statusEl.textContent = "映像は別の窓に出しています"; return; }
    if (window.documentPictureInPicture && await openVideoWindow()) return;
    toggleMiniWindow();
  };

  // ---- 参加画面：アクセスキーが合っているかを、最初に確かめる ----
  $('key').addEventListener('input', () => {
    $('join-btn').disabled = !$('key').value.trim();
    $('joinMsg').textContent = '';
  });
  $('key').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !$('join-btn').disabled) $('join-btn').click();
  });
  $('join-btn').onclick = async () => {
    $('join-btn').disabled = true;
    $('joinMsg').textContent = '確かめています…';
    try {
      const r = await fetch('/api/check', { method: 'POST', headers: authHeaders() });
      if (!r.ok) {
        $('joinMsg').textContent = r.status === 401 ? 'アクセスキーが違います' : '画面を開けませんでした（もう一度お試しください）';
        $('join-btn').disabled = !$('key').value.trim();
        return;
      }
    } catch (_) {
      $('joinMsg').textContent = '通信できませんでした。もう一度お試しください';
      $('join-btn').disabled = !$('key').value.trim();
      return;
    }
    $('joinMsg').textContent = '';
    await loadFiller();
    $('join').hidden = true;
    $('room').hidden = false;
    showIdle();
    showUi();
    await loadPackageFromServer();   // アクセスキーが合ったら、パッケージ（Google ドライブの zip）を最初に読み込む
  };

  // 操作パネルは、マウスやキーを動かした時だけ出す。入力中は消さない。
  let hideTimer = null;
  function showUi() {
    $('ui').classList.remove('idle');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!$('ui').contains(document.activeElement)) $('ui').classList.add('idle');
    }, 3000);
  }
  document.addEventListener('fullscreenchange', () => {
    document.documentElement.classList.toggle('fs', !!document.fullscreenElement);
  });
  document.addEventListener('mousemove', showUi);
  document.addEventListener('keydown', showUi);

  // ---- 画像（ブラウザの中だけで扱い、サーバーには送らない） ----
  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    pic.dataset.broken = '';
    pic.src = URL.createObjectURL(f);
    imageEntry = { blob: f, name: f.name };
    saveState();
  });
  pic.addEventListener('load', () => { pic.dataset.broken = ''; showIdle(); });
  pic.addEventListener('error', () => { pic.dataset.broken = '1'; showIdle(); });

  // 待機中の表示：基本の画像を出す（動画は隠す）。画像がなければ案内の文字
  function showIdle() {
    vid.classList.remove('on');
    vid.pause();
    const hasPic = pic.getAttribute('src') && !pic.dataset.broken;
    pic.hidden = !hasPic;
    placeholder.hidden = !!hasPic;
  }

  // 話している間の表示：動画を重ねる。読み込み中は、下の基本の画像が見えたままになる
  function playVideo(url) {
    placeholder.hidden = true;
    pic.hidden = !(pic.getAttribute('src') && !pic.dataset.broken);
    if (vid.dataset.url !== url) {
      vid.dataset.url = url;
      vid.src = url;
    }
    vid.play().catch(() => {});
  }
  // 動画が止まった・読み込み中のときは、基本の画像に戻す（黒い一コマを出さない）
  vid.preload = 'auto';
  vid.addEventListener('playing', () => vid.classList.add('on'));
  vid.addEventListener('waiting', () => vid.classList.remove('on'));
  vid.addEventListener('emptied', () => vid.classList.remove('on'));
  // 繰り返すときも黒くしない：終わったら先頭から続けて流す
  vid.addEventListener('ended', () => { vid.currentTime = 0; vid.play().catch(() => {}); });

  // ---- 動画 ----
  $('talkFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    if (talkUrl) URL.revokeObjectURL(talkUrl);
    talkUrl = URL.createObjectURL(f);
    $('talkName').textContent = f.name;
    talkEntry = { blob: f, name: f.name };
    saveState();
  });
  $('moodAdd').onclick = () => {
    const kw = $('moodKw').value.trim();
    if (!kw) {
      statusEl.textContent = "先に言葉を入力してください";
      return;
    }
    $('moodFile').click();
  };
  $('moodFile').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';   // 同じファイルを続けて選べるように
    if (!f) return;
    const kw = $('moodKw').value.trim();
    moods.push({ kw, name: f.name, blob: f, url: URL.createObjectURL(f) });
    $('moodKw').value = '';
    renderMoods();
    saveState();
  });
  // ---- パッケージ：言葉・動画・画像を、1つの zip にまとめて保存・読み込みする ----
  function guessType(name) {
    const ext = name.split('.').pop().toLowerCase();
    return { mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime',
             png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp' }[ext] || '';
  }
  $('pkgExport').onclick = async () => {
    if (typeof JSZip === 'undefined') {
      statusEl.textContent = "パッケージの機能を読み込めませんでした（通信を確かめてください）";
      return;
    }
    const zip = new JSZip();
    const manifest = { version: 1, talk: null, image: null, moods: [] };
    if (talkEntry) {
      zip.file('talk', talkEntry.blob);
      manifest.talk = { name: talkEntry.name, file: 'talk' };
    }
    if (imageEntry) {
      zip.file('image', imageEntry.blob);
      manifest.image = { name: imageEntry.name, file: 'image' };
    }
    moods.forEach((m, i) => {
      zip.file(`mood${i}`, m.blob);
      manifest.moods.push({ kw: m.kw, name: m.name, file: `mood${i}` });
    });
    zip.file('manifest.json', JSON.stringify(manifest, null, 2));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'web-talk-package.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    statusEl.textContent = `パッケージを保存しました（言葉 ${moods.length} 件）`;
  };
  // パッケージ（zip）を読み込み、画面に反映する。途中で失敗したら、今の内容はそのまま残す
  async function applyPackage(file) {
    if (typeof JSZip === 'undefined') throw new Error('パッケージの機能を読み込めませんでした（通信を確かめてください）');
    const zip = await JSZip.loadAsync(file);
    const manifest = JSON.parse(await zip.file('manifest.json').async('string'));
    const load = async entry => {
      const f = zip.file(entry.file);
      if (!f) throw new Error(`中身がありません: ${entry.file}`);
      return new Blob([await f.async('arraybuffer')], { type: guessType(entry.name) });
    };
    const talkBlob = manifest.talk ? await load(manifest.talk) : null;
    const imageBlob = manifest.image ? await load(manifest.image) : null;
    const moodBlobs = [];
    for (const m of manifest.moods || []) moodBlobs.push({ kw: m.kw, name: m.name, blob: await load(m) });

    moods.forEach(m => URL.revokeObjectURL(m.url));
    moods = moodBlobs.map(m => ({ ...m, url: URL.createObjectURL(m.blob) }));
    if (talkBlob) {
      if (talkUrl) URL.revokeObjectURL(talkUrl);
      talkUrl = URL.createObjectURL(talkBlob);
      talkEntry = { blob: talkBlob, name: manifest.talk.name };
      $('talkName').textContent = manifest.talk.name;
    }
    if (imageBlob) {
      imageEntry = { blob: imageBlob, name: manifest.image.name };
      pic.dataset.broken = '';
      pic.src = URL.createObjectURL(imageBlob);
    }
    renderMoods();
    saveState();
    showIdle();
    return moods.length;
  }
  $('pkgFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';   // 同じファイルを続けて選べるように
    if (!f) return;
    try {
      const n = await applyPackage(f);
      statusEl.textContent = `パッケージを読み込みました（言葉 ${n} 件）`;
    } catch (err) {
      statusEl.textContent = `パッケージを読み込めませんでした（ファイルが違うかもしれません）`;
    }
  });
  // アクセスキーが合ったあと、サーバーが持つ Google ドライブの zip を読み込む（既定）
  async function loadPackageFromServer() {
    statusEl.textContent = "パッケージを読み込んでいます…";
    try {
      const r = await fetch('/api/package', { headers: authHeaders() });
      if (r.status === 404) { statusEl.textContent = "準備ができました（パッケージは設定されていません）"; return; }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || '読み込めませんでした');
      const n = await applyPackage(await r.blob());
      statusEl.textContent = `準備ができました（パッケージを読み込みました。言葉 ${n} 件）`;
    } catch (err) {
      statusEl.textContent = `準備ができました（パッケージを読み込めませんでした：${err.message}）`;
    }
  }

  function renderMoods() {
    const list = $('moodList');
    list.textContent = '';
    moods.forEach((m, i) => {
      const li = document.createElement('li');
      const label = document.createElement('span');
      label.textContent = `「${m.kw}」→ ${m.name}`;
      const del = document.createElement('button');
      del.className = 'secondary';
      del.textContent = '削除';
      del.onclick = () => {
        URL.revokeObjectURL(m.url);
        moods.splice(i, 1);
        renderMoods();
        saveState();
      };
      li.append(label, del);
      list.appendChild(li);
    });
  }
  // 文の中に言葉があれば、その動画を選ぶ（最初に当てはまったもの）
  function pickVideo(emotion, sentence) {
    // 1. 言葉（または感情のタグ）に反応したら、その動画（狂気時でも優先）
    const hit = moods.find(m => m.kw !== '狂気' && (m.kw === emotion || sentence.includes(m.kw)));
    if (hit) return hit.url;
    // 2. 狂気時の返事で、言葉に反応しなかった文は「狂気」の動画
    if (replyCrazy) {
      const crazy = moods.find(m => m.kw === '狂気');
      if (crazy) return crazy.url;
    }
    // 3. それ以外は「話している時の動画」
    return talkUrl;
  }

  // 全画面の切り替え（ブラウザごと全画面にして、タブを消す）
  $('fullscreen').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {
      statusEl.textContent = "このブラウザは全画面に対応していません";
    });
  };

  // ---- 音声認識：AIが話している間は止めて、自分の声を拾わないようにする ----
  function startRec() {
    if (!recognition || !listening || speaking || busy) return;
    try { recognition.start(); } catch (_) { /* すでに動いている */ }
  }
  function stopRec() {
    if (!recognition) return;
    try { recognition.stop(); } catch (_) {}
  }
  function beginListening() {
    if (!SR) {
      statusEl.textContent = "このブラウザは音声認識に対応していません（Chrome を使ってください）";
      return;
    }
    recognition = new SR();
    recognition.lang = 'ja-JP';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onresult = e => {
      const text = e.results[e.results.length - 1][0].transcript.trim();
      if (text && !busy && !speaking) ask(text);
    };
    recognition.onend = () => startRec();
    listening = true;
    statusEl.textContent = "聞いています…";
    startRec();
  }

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'X-Access-Key': $('key').value };
  }
  // 通信が止まっても返事が止まらないように、30秒で打ち切る。止めるボタンでも中断できる。
  async function post(url, body, signal) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 30000);
    if (signal) signal.addEventListener('abort', () => ctl.abort());
    try {
      return await fetch(url, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body), signal: ctl.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // 相づちの音声を取っておく（参加するときに一度だけ）
  async function loadFiller() {
    try {
      const r = await fetch('/api/filler', { headers: authHeaders() });
      if (r.ok) fillerUrl = URL.createObjectURL(await r.blob());
    } catch (_) { /* 相づちなしで動く */ }
  }

  // 相づちを流して、終わったら resolve する（止めたときも resolve する）
  let resolveFiller = null, resolvePlay = null;
  // 返事が来るまで「はい！」を繰り返す
  function playFiller() {
    if (!fillerUrl) return Promise.resolve();
    return new Promise(resolve => {
      resolveFiller = resolve;
      fillerEl.onerror = resolve;
      fillerEl.loop = true;
      fillerEl.src = fillerUrl;
      fillerEl.play().catch(resolve);
    });
  }
  // 返事が来たら、すぐ「はい！」を止める
  function stopFiller() {
    fillerEl.loop = false;
    fillerEl.pause();
    if (resolveFiller) resolveFiller();
    resolveFiller = null;
  }

  // 返事を文ごとに区切る（。！？の後で切る）
  function splitSentences(text) {
    const parts = text.match(/[^。！？]+[。！？]?/g) || [text];
    return parts.map(p => p.trim()).filter(Boolean);
  }

  // 文ごとの音声を、同時に作り始める（待ち時間を重ねて短くするため）
  let replyCrazy = false;   // 今の返事が狂気時の声か
  function fetchSentence(text, signal, emotion) {
    const job = { ready: false, url: null, promise: null };
    job.promise = post('/api/tts', { text, crazy: replyCrazy, emotion }, signal)
      .then(async r => (r.ok ? URL.createObjectURL(await r.blob()) : null))
      .catch(() => null)
      .then(url => { job.ready = true; job.url = url; return url; });
    return job;
  }

  // できた順に、一文ずつ再生する。音声が間に合わないときは「はい！」で繋ぐ。
  async function speakReply(sentences, myGen, signal) {
    const jobs = sentences.map(s => fetchSentence(s.text, signal, s.emotion));
    for (let i = 0; i < jobs.length; i++) {
      const job = jobs[i];
      const gap = job.ready ? null : playFiller();   // 間に合わないときだけ「はい！」
      const url = await job.promise;
      stopFiller();
      if (gap) await gap;
      if (myGen !== gen) return;   // 止められた
      const video = pickVideo(sentences[i].emotion, sentences[i].text);
      if (video) playVideo(video); else showIdle();
      if (!url) {
        statusEl.textContent = "音声は出せませんでした（文字だけ表示しています）";
        continue;
      }
      await new Promise(resolve => {
        resolvePlay = resolve;
        replyEl.onended = resolve;
        replyEl.onerror = resolve;
        replyEl.src = url;
        replyEl.play().catch(resolve);
      });
      resolvePlay = null;
      if (myGen !== gen) return;
    }
  }

  let gen = 0;            // 返事ごとの番号。止めると番号が変わり、古い返事はやめる
  let abortCtl = null;    // 進行中の通信を中断するためのもの

  async function ask(text) {
    if (busy) {
      statusEl.textContent = "返事の途中です。終わるか「話すのをやめる」を押してください";
      return;
    }
    busy = true;
    speaking = true;   // 相づちと返事の間は、音声認識を止める
    stopRec();
    const myGen = ++gen;
    if (talkUrl) playVideo(talkUrl); else showIdle();   // 待っている間も、話している時の動画を流す
    abortCtl = new AbortController();
    const signal = abortCtl.signal;
    subtitle.textContent = `あなた：${text}`;
    statusEl.textContent = "考え中…";
    try {
      const fillerDone = playFiller();   // 相づちを先に流す
      const r = await post('/api/chat', { text }, signal);
      const j = await r.json();
      if (myGen !== gen) return;
      replyCrazy = !!j.crazy;
      stopFiller();   // 返事が来たので「はい！」を止める
      if (!r.ok) {
        subtitle.textContent = j.error || "エラーが発生しました";
        await fillerDone;
        return;
      }
      subtitle.textContent = `AI：${j.reply}`;
      statusEl.textContent = "話しています…";
      await speakReply(j.sentences || [{ emotion: null, text: j.reply }], myGen, signal);
    } catch (e) {
      if (myGen === gen) {
        subtitle.textContent = e.name === 'AbortError'
          ? "時間がかかりすぎたので、止めました"
          : `通信エラー：${e}`;
      }
    } finally {
      if (myGen === gen) {
        stopFiller();
        busy = false;
        speaking = false;
        abortCtl = null;
        showIdle();
        statusEl.textContent = listening ? "聞いています…" : "";
        startRec();
      }
    }
  }

  // 話すのをやめる：返事の音声と動画を止め、進行中の返事を捨てる
  function stopSpeaking() {
    gen++;
    if (abortCtl) abortCtl.abort();
    replyEl.pause();
    fillerEl.pause();
    stopFiller();
    if (resolvePlay) resolvePlay();
    resolvePlay = null;
    busy = false;
    speaking = false;
    abortCtl = null;
    showIdle();
    statusEl.textContent = listening ? "聞いています…" : "話すのをやめました";
    startRec();
  }
  $('stop').onclick = stopSpeaking;

  function submitText() {
    const t = $('text').value.trim();
    if (!t) return;
    if (busy) {
      statusEl.textContent = "返事の途中です。終わるか「話すのをやめる」を押してください";
      return;   // 入力は残しておく（消えないように）
    }
    $('text').value = '';
    ask(t);
  }

  $('talk').onclick = () => {
    $('talk').disabled = true;
    beginListening();
  };
  $('send').onclick = submitText;
  $('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submitText(); });
  $('reset').onclick = async () => {
    await fetch('/api/reset', { method: 'POST', headers: authHeaders() });
    subtitle.textContent = '';
  };
  restoreState();
})();
</script>
</body>
</html>
